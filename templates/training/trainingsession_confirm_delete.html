{% extends 'base.html' %}

{% block title %}
    Delete Training Session | Martial Arts Academy
{% endblock %}

{% block content %}
    <h2>Delete Training Session</h2>

    <p>
        Are you sure you want to delete
        <strong>{{ object.title }}</strong>?
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Delete</button>
    </form>

    <a href="{% url 'training-detail' object.pk %}">
        Cancel
    </a>
{% endblock %}
