{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Martial Arts Academy{% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>

{% include 'common/header.html' %}

<main>
    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}
</main>

{% include 'common/footer.html' %}

</body>
</html>
